<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<title>Valeria Basket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff6a00'/%3E%3Cpath d='M2 32h60M32 2v60M8 12c10 8 10 32 0 40M56 12c-10 8-10 32 0 40' stroke='%23000' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1220; --card:#1a1f38; --ink:#fff; --muted:#a8b0d4;
    --ok:#3ddc84; --bad:#ff5470; --accent:#ff6a00; --accent2:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
  body{min-height:100vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
  h1 span{color:var(--accent2)}
  .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button{font:inherit;color:var(--ink);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;touch-action:manipulation}
  .seg{display:flex;background:#0b0e1c;border-radius:14px;padding:4px;gap:4px;margin-bottom:8px}
  .seg button{flex:1;background:transparent;padding:12px;font-size:15px;border-radius:10px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#111}
  .seg.shot button.on{background:var(--accent2);color:#111}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0}
  .stat b{font-size:34px}
  .pct{font-size:52px;font-weight:800;text-align:center;margin:6px 0;color:var(--accent2)}
  .big{display:flex;gap:12px;margin-top:6px}
  .big button{flex:1;padding:26px 10px;font-size:22px;border-radius:20px}
  .ok{background:var(--ok);color:#062a17}
  .bad{background:var(--bad);color:#3a0010}
  .ghost{background:#2a3157;color:var(--ink)}
  .mini{background:#2a3157;color:var(--ink);padding:10px;font-size:14px;font-weight:600}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#0b0e1c;border-radius:14px;padding:12px}
  .kpi small{color:var(--muted);display:block;margin-bottom:4px}
  .kpi b{font-size:22px}
  .hist{max-height:34vh;overflow:auto;margin-top:6px}
  .h-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 4px;border-bottom:1px solid #262b48;font-size:14px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#2a3157;color:var(--muted)}
  .tag.n{background:#3a2000;color:var(--accent2)}
  .tag.b{background:#003a2a;color:var(--ok)}
  .tag.s{background:#26183a;color:#c9a6ff}
  .flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
  .flash.on{opacity:.35}
  .chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;margin-top:18px}
  .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bar .b{width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 0 0;min-height:2px;position:relative}
  .bar .b.empty{background:#0b0e1c}
  .bar .v{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
  .bar .d{font-size:11px;color:var(--muted)}
  .bar .d.today{color:var(--accent2);font-weight:700}
  .chart-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px}
  .chart-title b{font-size:17px}
  .chart-title small{color:var(--muted);font-size:12px;text-align:right}
  footer{color:var(--muted);text-align:center;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<h1>🏀 <span>Valeria</span> Basket</h1>
<div class="sub"><span id="age"></span> · sesión de hoy</div>

<div class="card">
  <div class="seg shot" id="segShot">
    <button data-s="libres" class="on">Tiros libres</button>
    <button data-s="media">Media distancia</button>
  </div>
  <div class="seg" id="segHoop">
    <button data-h="normal" class="on">Canasta normal</button>
    <button data-h="baja">Canasta baja</button>
  </div>
  <div class="pct" id="pct">—</div>
  <div class="stat"><span>Metidos</span><b id="in">0</b></div>
  <div class="stat"><span>Fallados</span><b id="miss">0</b></div>
  <div class="stat"><span>Intentos</span><b id="tot">0</b></div>
  <div class="big">
    <button class="ok" id="bIn">✅ METIDO</button>
    <button class="bad" id="bMiss">❌ FALLO</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="ghost mini" id="bUndo">↩︎ Deshacer</button>
    <button class="ghost mini" id="bEnd">🏁 Terminar sesión</button>
  </div>
</div>

<div class="card">
  <div class="chart-title">
    <b>📊 Últimos 7 días</b>
    <small id="chartLabel"></small>
  </div>
  <div class="chart" id="chart"></div>
</div>

<div class="card">
  <div class="kpis">
    <div class="kpi"><small>Récord % (esta vista)</small><b id="rP">—</b></div>
    <div class="kpi"><small>Récord metidos seguidos</small><b id="rS">0</b></div>
    <div class="kpi"><small>Racha de días 🔥</small><b id="rD">0</b></div>
    <div class="kpi"><small>Sesiones totales</small><b id="rT">0</b></div>
  </div>
</div>

<div class="card">
  <div class="stat"><span><b style="font-size:17px">Historial</b></span>
    <span class="row" style="gap:6px">
      <button class="mini" id="bExp">Exportar</button>
      <button class="mini" id="bImp">Importar</button>
    </span>
  </div>
  <div class="hist" id="hist"></div>
</div>

<footer>Todo se guarda solo en este móvil.</footer>
<div class="flash" id="flash"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
const K='valeria-basket-v2';
const K1='valeria-basket-v1';
const SHOTS=['libres','media'], HOOPS=['normal','baja'];
const emptyBucket = ()=>({in:0,miss:0,streak:0,best:0,log:[]});
const emptyCur = ()=>({libres:{normal:emptyBucket(),baja:emptyBucket()}, media:{normal:emptyBucket(),baja:emptyBucket()}});

function migrateV1(v1){
  const cur = emptyCur();
  cur.libres.normal = {...emptyBucket(), ...v1.cur.normal};
  cur.libres.baja   = {...emptyBucket(), ...v1.cur.baja};
  const sessions = (v1.sessions||[]).map(s=>({
    date:s.date,
    libres:{normal:s.normal, baja:s.baja},
    media: {normal:{in:0,miss:0,best:0}, baja:{in:0,miss:0,best:0}}
  }));
  return {shot:'libres', hoop:v1.hoop||'normal', cur, sessions};
}
function load(){
  try{ const v2 = JSON.parse(localStorage.getItem(K)); if(v2) return v2; }catch(_){}
  try{ const v1 = JSON.parse(localStorage.getItem(K1)); if(v1) return migrateV1(v1); }catch(_){}
  return null;
}
const state = load() || {shot:'libres', hoop:'normal', cur:emptyCur(), sessions:[]};
function save(){ localStorage.setItem(K, JSON.stringify(state)) }

const $ = id => document.getElementById(id);
const curBucket = ()=>state.cur[state.shot][state.hoop];

$('segShot').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.shot = b.dataset.s; save(); render();
});
$('segHoop').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.hoop = b.dataset.h; save(); render();
});

$('bIn').onclick   = ()=>shot(true);
$('bMiss').onclick = ()=>shot(false);
$('bUndo').onclick = ()=>{
  const c = curBucket();
  const last = c.log.pop(); if(last===undefined) return;
  if(last){ c.in--; } else { c.miss--; }
  c.streak = 0;
  for(let i=c.log.length-1;i>=0;i--){ if(c.log[i]) c.streak++; else break; }
  save(); render();
};
$('bEnd').onclick = endSession;
$('bExp').onclick = exportJson;
$('bImp').onclick = ()=>$('file').click();
$('file').onchange = importJson;

function shot(made){
  const c = curBucket();
  c.log.push(made?1:0);
  if(made){ c.in++; c.streak++; if(c.streak>c.best) c.best=c.streak; }
  else    { c.miss++; c.streak=0; }
  flash(made?'#3ddc84':'#ff5470');
  if(navigator.vibrate) navigator.vibrate(made?30:[15,40,15]);
  save(); render();
}

function endSession(){
  let total=0;
  for(const s of SHOTS) for(const h of HOOPS){ const x=state.cur[s][h]; total+=x.in+x.miss; }
  if(!total){ alert('Aún no hay tiros en esta sesión'); return; }
  const snap = (x)=>({in:x.in,miss:x.miss,best:x.best});
  state.sessions.push({
    date: new Date().toISOString(),
    libres:{normal:snap(state.cur.libres.normal), baja:snap(state.cur.libres.baja)},
    media: {normal:snap(state.cur.media.normal),  baja:snap(state.cur.media.baja)}
  });
  state.cur = emptyCur();
  save(); render();
  exportJson(); // ponytail: copia automática al terminar sesión; se acumulan archivos en Descargas, limpiar a mano de vez en cuando
}

function pct(i,m){ const t=i+m; return t? Math.round(i*100/t)+'%' : '—'; }

function streakDays(){
  if(!state.sessions.length) return 0;
  const days = new Set(state.sessions.map(s=>localDay(s.date)));
  let d = new Date(); d.setHours(0,0,0,0);
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function recordPctCurrent(){
  let best = -1;
  for(const s of state.sessions){
    const x = s[state.shot][state.hoop]; const t = x.in+x.miss;
    if(t>=5){ const p = x.in/t; if(p>best) best=p; }
  }
  return best<0? '—' : Math.round(best*100)+'%';
}

function recordStreak(){
  let best=0;
  for(const s of state.sessions) for(const sh of SHOTS) for(const h of HOOPS){
    if((s[sh][h].best||0)>best) best=s[sh][h].best;
  }
  for(const sh of SHOTS) for(const h of HOOPS){
    if(state.cur[sh][h].best>best) best=state.cur[sh][h].best;
  }
  return best;
}

function dayKey(d){ const x=new Date(d); x.setHours(0,0,0,0); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function localDay(iso){ return dayKey(new Date(iso)); }

function renderChart(){
  const wrap = $('chart'); wrap.innerHTML='';
  const days=[]; const t=new Date(); t.setHours(0,0,0,0);
  for(let i=6;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); days.push(d); }
  const dayMap = new Map();
  for(const d of days) dayMap.set(dayKey(d), {in:0,miss:0});
  for(const s of state.sessions){
    const k = localDay(s.date);
    if(!dayMap.has(k)) continue;
    const x = s[state.shot][state.hoop];
    const agg = dayMap.get(k);
    agg.in += x.in||0; agg.miss += x.miss||0;
  }
  const today = dayKey(new Date());
  if(dayMap.has(today)){
    const x = state.cur[state.shot][state.hoop];
    const agg = dayMap.get(today);
    agg.in += x.in; agg.miss += x.miss;
  }
  const dn = ['D','L','M','X','J','V','S'];
  for(const d of days){
    const agg = dayMap.get(dayKey(d));
    const total = agg.in+agg.miss;
    const p = total? agg.in/total : 0;
    const h = total? Math.max(4, Math.round(p*100)) : 0;
    const isToday = dayKey(d)===today;
    const bar = document.createElement('div'); bar.className='bar';
    bar.innerHTML = `
      <div class="b ${total?'':'empty'}" style="height:${h}%">
        ${total?`<span class="v">${agg.in}/${total}</span>`:''}
      </div>
      <div class="d ${isToday?'today':''}">${dn[d.getDay()]}</div>`;
    wrap.appendChild(bar);
  }
  $('chartLabel').textContent = `${state.shot==='libres'?'Tiros libres':'Media distancia'} · ${state.hoop==='normal'?'canasta normal':'canasta baja'} · % por día`;
}

function render(){
  const c = curBucket();
  $('in').textContent = c.in;
  $('miss').textContent = c.miss;
  $('tot').textContent = c.in+c.miss;
  $('pct').textContent = pct(c.in,c.miss);
  $('rP').textContent = recordPctCurrent();
  $('rS').textContent = recordStreak();
  $('rD').textContent = streakDays();
  $('rT').textContent = state.sessions.length;
  [...$('segShot').children].forEach(x=>x.classList.toggle('on', x.dataset.s===state.shot));
  [...$('segHoop').children].forEach(x=>x.classList.toggle('on', x.dataset.h===state.hoop));
  const h = $('hist'); h.innerHTML='';
  [...state.sessions].reverse().slice(0,60).forEach(s=>{
    const d = new Date(s.date);
    const ds = d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    for(const sh of SHOTS) for(const hp of HOOPS){
      const x = s[sh][hp];
      if(!x || (x.in+x.miss)===0) continue;
      const row = document.createElement('div');
      row.className='h-row';
      const shTag = sh==='libres'?'':'<span class="tag s">Media</span> ';
      row.innerHTML = `<span>${ds} ${shTag}<span class="tag ${hp==='normal'?'n':'b'}">${hp==='normal'?'Normal':'Baja'}</span></span>
        <span>${x.in}/${x.in+x.miss}</span><span>${pct(x.in,x.miss)}</span>`;
      h.appendChild(row);
    }
  });
  renderChart();
}

function flash(color){
  const f = $('flash'); f.style.background = color;
  f.classList.add('on'); setTimeout(()=>f.classList.remove('on'), 160);
}

function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'valeria-basket-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJson(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      let d = JSON.parse(r.result);
      if(d.cur && d.cur.normal && !d.cur.libres) d = migrateV1(d);
      if(!d.cur||!d.sessions||!d.cur.libres) throw 0;
      if(!confirm('Esto reemplaza los datos actuales. ¿Seguro?')) return;
      Object.assign(state, d); save(); render();
    }catch(_){ alert('Archivo no válido'); }
  };
  r.readAsText(f);
}

function ageText(){
  const dob = new Date(2018,8,27);
  const t = new Date();
  let y = t.getFullYear()-dob.getFullYear();
  const m = t.getMonth()-dob.getMonth();
  if(m<0 || (m===0 && t.getDate()<dob.getDate())) y--;
  return y+' años';
}
$('age').textContent = ageText();

render();
</script>
</body>
</html>
